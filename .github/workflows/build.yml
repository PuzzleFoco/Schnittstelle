name: Build & Release

# Baut bei jedem Push eine installierbare Debug-APK und hängt sie an ein Release.
# Zwei Wege:
#   1. Normaler Push auf main  -> Build + APK als Workflow-Artefakt
#   2. Tag "v1.2.3" pushen     -> zusaetzlich ein GitHub-Release mit der APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests und Debug-APK bauen
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Testbericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: APK umbenennen (Name ohne Projektpfad)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/schnittstelle-${GITHUB_REF_NAME}-debug.apk"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: schnittstelle-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Release anlegen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
